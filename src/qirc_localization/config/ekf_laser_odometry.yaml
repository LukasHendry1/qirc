# EKF overrides for odometry:=lidar (ekf.launch.py loads this after
# ekf.yaml): LiDAR odometry (laser_odometry) stands in for the track
# odometry from the drive motor encoders, which the robot doesn't have yet.
#
# Unlike the track odometry, the LiDAR's turn rate is good (it doesn't
# skid), so it's fused too, alongside the gyro. laser_odometry raises its
# covariances when a match is poorly constrained, so the EKF then leans on
# the gyro and its own motion model.
ekf_filter_node:
  ros__parameters:
    odom0: /laser_odom
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  true,  false,
                   false, false, true,
                   false, false, false]
