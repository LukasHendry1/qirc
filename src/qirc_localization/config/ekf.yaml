# robot_localization EKF: fuses the LiDAR odometry and the front camera's
# gyro into odom -> base_link. Started by launch/ekf.launch.py.
#
# The robot has no drive motor encoders: its speed comes from LiDAR
# odometry (laser_odometry, scan matching).
#
# Why these inputs:
#   - LiDAR odometry gives the speed (forward, sideways) and the turn rate.
#     It runs at the LiDAR's 10 Hz, a little behind the robot, and is weak
#     where the walls are all parallel (it then reports a large covariance).
#   - The gyro measures turns directly at 200 Hz, so it carries the heading
#     between scans and through poor matches. Its bias is removed first by
#     imu_bias.
#   - The accelerometer is not used: integrating it for speed drifts.
ekf_filter_node:
  ros__parameters:
    frequency: 50.0
    # Flat floors: estimate x, y, yaw only.
    two_d_mode: true
    publish_tf: true

    # REP 105; slam_toolbox publishes map -> odom on top of this.
    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    # Each *_config is [x, y, z, roll, pitch, yaw,
    #                   vx, vy, vz, vroll, vpitch, vyaw,
    #                   ax, ay, az].

    # LiDAR odometry: speeds and turn rate. Not its pose: that is its own
    # integrated estimate, which drifts; the EKF integrates the speeds itself.
    odom0: /laser_odom
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  true,  false,
                   false, false, true,
                   false, false, false]

    # Gyro: turn rate only. This config is in the IMU's own frame
    # (front_camera_imu_optical_frame: z forward, y down), not base_link's,
    # so all three gyro axes are enabled: the EKF rotates them into base_link
    # with TF and, in 2D mode, keeps only the yaw rate. (Enabling only vyaw
    # here would select the camera's forward axis, i.e. roll.) This also
    # stays right if the camera is tilted.
    imu0: /front_camera/imu/unbiased
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  true,  true,  true,
                  false, false, false]
