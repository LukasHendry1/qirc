# slam_toolbox (online async) parameters for building the house map.
# Started by launch/mapping.launch.py.
#
# Only the parameters that differ from slam_toolbox's defaults, or that this
# robot depends on, are set here; everything else is the slam_toolbox default
# (see mapper_params_online_async.yaml in the slam_toolbox package).

slam_toolbox:
  ros__parameters:
    mode: mapping

    # ===== Frames and topics: must match the URDF and the drivers ==========
    # map -> odom is published by slam_toolbox; odom -> base_link by the EKF
    # (#54) or, in simulation for now, by Gazebo's DiffDrive.
    map_frame: map
    odom_frame: odom
    base_frame: base_link
    scan_topic: /scan

    # ===== LiDAR: RPLIDAR A2M8 (0.15-12 m, 10 Hz) ==========================
    max_laser_range: 12.0
    # Process every scan (the A2M8 is only 10 Hz).
    throttle_scans: 1

    # ===== Map =============================================================
    resolution: 0.05            # m per cell; fine enough for doorways
    # Publish the map more often than the default (5 s) so it can be
    # watched growing in RViz while driving.
    map_update_interval: 2.0

    # ===== When to add a scan to the map ===================================
    # A scan is used once the robot has moved this far or turned this much
    # since the last one. Turning is kept small because track odometry
    # overestimates turns (about 1.4x in simulation, #57): the scan matcher
    # must correct the heading error before it grows past its search window
    # (coarse_search_angle_offset, default 0.349 rad).
    minimum_travel_distance: 0.3   # m
    minimum_travel_heading: 0.3    # rad
    minimum_time_interval: 0.5     # s

    # Allow for the simulation clock and a busy Jetson.
    transform_timeout: 0.2
    tf_buffer_duration: 30.0
