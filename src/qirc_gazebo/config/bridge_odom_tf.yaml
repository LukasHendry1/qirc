# DiffDrive's odom -> base_link transform, bridged to /tf.
# sim.launch.py starts this bridge only with ekf:=false; otherwise the EKF
# (qirc_localization) publishes odom -> base_link.

- ros_topic_name: /tf
  gz_topic_name: /odom/tf
  ros_type_name: tf2_msgs/msg/TFMessage
  gz_type_name: ignition.msgs.Pose_V
  direction: GZ_TO_ROS
