# QIRC power distribution (draft)
#
# Render: pip install wireviz && wireviz docs/wiring/power.yml
# Items marked TBD depend on parts not chosen yet (battery, drive motors,
# arm motors). Wire gauges are placeholders until the drive motor stall
# current is known; size the main fuse and main wires from it.

metadata:
  title: QIRC power distribution (draft)

options:
  bgcolor: WH
  color_mode: full

templates:
  - &red_black
    wirecount: 2
    colors: [RD, BK]
  - &bus
    type: Bus bar / terminal block

connectors:
  # --- Source and protection ---------------------------------------------
  BAT:
    type: Battery
    subtype: 4S LiFePO4, 12.8 V nominal (10-14.6 V), ~12-15 Ah (TBD)
    pinlabels: [B+, B-]
    notes: XT60 connector
  F1:
    type: Main fuse + holder
    subtype: Rating TBD (just above total peak current)
    pinlabels: [IN, OUT]
  SW1:
    type: Main power switch
    pinlabels: [IN, OUT]
  ES1:
    type: E-stop (latching, normally closed)
    subtype: Cuts the motor rail only
    pinlabels: [IN, OUT]

  # --- Distribution ------------------------------------------------------
  BUS_12V:
    <<: *bus
    subtype: Unswitched 12 V (after main switch)
    pinlabels: [IN, TO_E-STOP, TO_19V, TO_5V]
  BUS_MOT:
    <<: *bus
    subtype: Motor rail (after E-stop)
    pinlabels: [IN, DRIVE_L, DRIVE_R, ARM_1, ARM_2, STEP_1, STEP_2, LIGHTS]
  BUS_GND:
    <<: *bus
    subtype: Common ground
    pinlabels: [BAT, DRIVE_L, DRIVE_R, ARM_1, ARM_2, STEP_1, STEP_2, LIGHTS, 19V, 5V]

  # --- Regulators and computer -------------------------------------------
  DC19:
    type: DC-DC buck-boost
    subtype: 12 V in, 19 V out, 40 W min
    pinlabels: [IN+, IN-, OUT+, OUT-]
    notes: Keeps the Jetson stable when motors dip the battery
  DC5:
    type: DC-DC buck
    subtype: 12 V in, 5 V out, 3 A min
    pinlabels: [IN+, IN-, OUT+, OUT-]
  JETSON:
    type: Jetson Orin Nano dev kit
    pinlabels: [DC_IN+, DC_IN-, USB-A 1, USB-A 2, USB-A 3, USB-A 4]
    notes: DC barrel jack, 19 V nominal

  # --- USB devices (5 V from the Jetson) ---------------------------------
  CAM_F:
    type: RealSense D435i (front)
    pinlabels: [USB-C]
  CAM_R:
    type: OAK-D Lite (rear)
    pinlabels: [USB-C]
  LIDAR:
    type: RPLidar (model TBD)
    pinlabels: [USB]
  PICO:
    type: Raspberry Pi Pico (RP2040)
    pinlabels: [Micro-USB]
    notes: Signal wiring in a separate diagram (pin map TBD)

  # --- Motor drivers and loads -------------------------------------------
  MD_L:
    type: Cytron MD10C (drive left)
    pinlabels: [POWER+, POWER-, MA, MB]
  MD_R:
    type: Cytron MD10C (drive right)
    pinlabels: [POWER+, POWER-, MA, MB]
  M_L:
    type: Drive motor left (TBD, 12 V with encoder)
    pinlabels: [M+, M-]
  M_R:
    type: Drive motor right (TBD, 12 V with encoder)
    pinlabels: [M+, M-]
  AD_1:
    type: Arm motor driver 1 (TBD)
    pinlabels: [V+, GND, OUT_A, OUT_B]
  AD_2:
    type: Arm motor driver 2 (TBD)
    pinlabels: [V+, GND, OUT_A, OUT_B]
  AM_1:
    type: Arm motor 1 (voltage TBD)
    pinlabels: [M+, M-]
  AM_2:
    type: Arm motor 2 (voltage TBD)
    pinlabels: [M+, M-]
  DRV_1:
    type: DRV8825 (dispenser 1)
    pinlabels: [VMOT, GND, A1, A2, B1, B2]
    notes: 100 uF cap across VMOT-GND; current limit 1.2-1.5 A
  DRV_2:
    type: DRV8825 (dispenser 2)
    pinlabels: [VMOT, GND, A1, A2, B1, B2]
    notes: 100 uF cap across VMOT-GND; current limit 1.2-1.5 A
  ST_1:
    type: NEMA 17 stepper (dispenser 1)
    pinlabels: [A+, A-, B+, B-]
  ST_2:
    type: NEMA 17 stepper (dispenser 2)
    pinlabels: [A+, A-, B+, B-]
  MOSFET:
    type: Logic-level MOSFET module (headlights)
    pinlabels: [VIN+, VIN-, OUT+, OUT-]
    notes: PWM gate signal from Pico (signal diagram)
  HEAD:
    type: Headlights (12 V LED)
    pinlabels: [+, '-']
  LEDS:
    type: WS2812B status LEDs
    pinlabels: [5V, GND]
    notes: Data line from Pico (signal diagram)

cables:
  # Main path: battery -> fuse -> switch -> 12 V bus -> E-stop -> motor bus
  W_BAT:
    <<: *red_black
    gauge: 12 AWG
    notes: Gauge TBD (size from motor stall current)
  W_F:
    wirecount: 1
    colors: [RD]
    gauge: 12 AWG
    notes: Gauge TBD (size from motor stall current)
  W_SW:
    wirecount: 1
    colors: [RD]
    gauge: 12 AWG
    notes: Gauge TBD (size from motor stall current)
  W_ES_IN:
    wirecount: 1
    colors: [RD]
    gauge: 12 AWG
    notes: Gauge TBD (size from motor stall current)
  W_ES_OUT:
    wirecount: 1
    colors: [RD]
    gauge: 12 AWG
    notes: Gauge TBD (size from motor stall current)

  # Feeds from the buses
  W_MD_L:
    <<: *red_black
    gauge: 14 AWG
    notes: Gauge TBD (size from motor stall current)
  W_MD_R:
    <<: *red_black
    gauge: 14 AWG
    notes: Gauge TBD (size from motor stall current)
  W_AD_1:
    <<: *red_black
    gauge: 18 AWG
  W_AD_2:
    <<: *red_black
    gauge: 18 AWG
  W_DRV_1:
    <<: *red_black
    gauge: 18 AWG
  W_DRV_2:
    <<: *red_black
    gauge: 18 AWG
  W_MOSFET:
    <<: *red_black
    gauge: 18 AWG
  W_DC19_IN:
    <<: *red_black
    gauge: 16 AWG
  W_DC5_IN:
    <<: *red_black
    gauge: 18 AWG

  # Regulator outputs
  W_JETSON:
    <<: *red_black
    gauge: 16 AWG
    notes: DC barrel plug (check carrier board size)
  W_LEDS:
    <<: *red_black
    gauge: 20 AWG

  # Motor leads
  W_M_L:
    wirecount: 2
    colors: [RD, BK]
    gauge: 14 AWG
    notes: Gauge TBD (size from motor stall current)
  W_M_R:
    wirecount: 2
    colors: [RD, BK]
    gauge: 14 AWG
    notes: Gauge TBD (size from motor stall current)
  W_AM_1:
    wirecount: 2
    colors: [RD, BK]
    gauge: 20 AWG
    notes: Gauge TBD (size from motor stall current)
  W_AM_2:
    wirecount: 2
    colors: [RD, BK]
    gauge: 20 AWG
    notes: Gauge TBD (size from motor stall current)
  W_ST_1:
    wirecount: 4
    colors: [BK, GN, RD, BU]
    gauge: 22 AWG
    notes: Check coil pairs on the motor datasheet
  W_ST_2:
    wirecount: 4
    colors: [BK, GN, RD, BU]
    gauge: 22 AWG
    notes: Check coil pairs on the motor datasheet
  W_HEAD:
    <<: *red_black
    gauge: 20 AWG

  # USB
  USB_F:
    category: bundle
    type: USB 3 cable (A to C)
    wirecount: 1
    colors: [BU]
  USB_R:
    category: bundle
    type: USB 3 cable (A to C)
    wirecount: 1
    colors: [BU]
  USB_L:
    category: bundle
    type: USB cable (LiDAR adapter)
    wirecount: 1
    colors: [BK]
  USB_P:
    category: bundle
    type: USB cable (A to Micro-USB)
    wirecount: 1
    colors: [BK]

connections:
  # Battery: + through the fuse, - to the ground bus
  - - BAT: [1]
    - W_BAT: [1]
    - F1: [1]
  - - BAT: [2]
    - W_BAT: [2]
    - BUS_GND: [1]
  - - F1: [2]
    - W_F: [1]
    - SW1: [1]
  - - SW1: [2]
    - W_SW: [1]
    - BUS_12V: [1]
  - - BUS_12V: [2]
    - W_ES_IN: [1]
    - ES1: [1]
  - - ES1: [2]
    - W_ES_OUT: [1]
    - BUS_MOT: [1]

  # 19 V for the Jetson (unswitched, stays on during E-stop)
  - - BUS_12V: [3]
    - W_DC19_IN: [1]
    - DC19: [1]
  - - BUS_GND: [9]
    - W_DC19_IN: [2]
    - DC19: [2]
  - - DC19: [3, 4]
    - W_JETSON: [1, 2]
    - JETSON: [1, 2]

  # 5 V for the status LEDs
  - - BUS_12V: [4]
    - W_DC5_IN: [1]
    - DC5: [1]
  - - BUS_GND: [10]
    - W_DC5_IN: [2]
    - DC5: [2]
  - - DC5: [3, 4]
    - W_LEDS: [1, 2]
    - LEDS: [1, 2]

  # USB devices
  - - JETSON: [3]
    - USB_F: [1]
    - CAM_F: [1]
  - - JETSON: [4]
    - USB_R: [1]
    - CAM_R: [1]
  - - JETSON: [5]
    - USB_L: [1]
    - LIDAR: [1]
  - - JETSON: [6]
    - USB_P: [1]
    - PICO: [1]

  # Drive motors
  - - BUS_MOT: [2]
    - W_MD_L: [1]
    - MD_L: [1]
  - - BUS_GND: [2]
    - W_MD_L: [2]
    - MD_L: [2]
  - - MD_L: [3, 4]
    - W_M_L: [1, 2]
    - M_L: [1, 2]
  - - BUS_MOT: [3]
    - W_MD_R: [1]
    - MD_R: [1]
  - - BUS_GND: [3]
    - W_MD_R: [2]
    - MD_R: [2]
  - - MD_R: [3, 4]
    - W_M_R: [1, 2]
    - M_R: [1, 2]

  # Arm motors
  - - BUS_MOT: [4]
    - W_AD_1: [1]
    - AD_1: [1]
  - - BUS_GND: [4]
    - W_AD_1: [2]
    - AD_1: [2]
  - - AD_1: [3, 4]
    - W_AM_1: [1, 2]
    - AM_1: [1, 2]
  - - BUS_MOT: [5]
    - W_AD_2: [1]
    - AD_2: [1]
  - - BUS_GND: [5]
    - W_AD_2: [2]
    - AD_2: [2]
  - - AD_2: [3, 4]
    - W_AM_2: [1, 2]
    - AM_2: [1, 2]

  # Dispenser steppers
  - - BUS_MOT: [6]
    - W_DRV_1: [1]
    - DRV_1: [1]
  - - BUS_GND: [6]
    - W_DRV_1: [2]
    - DRV_1: [2]
  - - DRV_1: [3, 4, 5, 6]
    - W_ST_1: [1, 2, 3, 4]
    - ST_1: [1, 2, 3, 4]
  - - BUS_MOT: [7]
    - W_DRV_2: [1]
    - DRV_2: [1]
  - - BUS_GND: [7]
    - W_DRV_2: [2]
    - DRV_2: [2]
  - - DRV_2: [3, 4, 5, 6]
    - W_ST_2: [1, 2, 3, 4]
    - ST_2: [1, 2, 3, 4]

  # Headlights
  - - BUS_MOT: [8]
    - W_MOSFET: [1]
    - MOSFET: [1]
  - - BUS_GND: [8]
    - W_MOSFET: [2]
    - MOSFET: [2]
  - - MOSFET: [3, 4]
    - W_HEAD: [1, 2]
    - HEAD: [1, 2]
